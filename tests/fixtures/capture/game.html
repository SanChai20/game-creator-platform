<!doctype html><html><head><meta charset="utf-8"><style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #808080; }
  /* four corner squares of known colours, 40 px, and a moving square so the page sends frames */
  i { position: fixed; width: 40px; height: 40px; }
  #tl { left: 0; top: 0; background: #ff0000; } #tr { right: 0; top: 0; background: #00ff00; }
  #bl { left: 0; bottom: 0; background: #0000ff; } #br { right: 0; bottom: 0; background: #ffff00; }
  #mv { left: 45%; top: 45%; width: 20px; height: 20px; background: #fff; animation: mv .5s linear infinite alternate; }
  @keyframes mv { to { transform: translateX(60px); } }
</style></head><body><i id="tl"></i><i id="tr"></i><i id="bl"></i><i id="br"></i><i id="mv"></i></body></html>
