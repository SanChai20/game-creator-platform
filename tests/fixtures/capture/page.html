<!doctype html><html><head><meta charset="utf-8"><title>capture test</title>
<style>
  html, body { margin: 0; background: #2a2833; font: 14px system-ui, sans-serif; color: #fff; }
  /* the console's layout around a game: a dialog, a box of fractional size and place, rounded and clipping */
  #box { position: absolute; left: 101.5px; top: 83.3px; width: 801px; height: 450.6px; border-radius: 12px; overflow: hidden; background: #000; }
  #box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #go { position: absolute; left: 4px; top: 4px; }
</style></head><body>
<div id="box"><iframe id="game"></iframe></div>
<button id="go">share</button>
<script type="module">
  import * as cap from './capture.js';
  window.cap = cap;
  const q = new URLSearchParams(location.search);
  document.getElementById('game').src = q.get('game');
  document.getElementById('go').onclick = () => { window.started = cap.startTabShare(); };
  window.ready = true;
</script>
</body></html>
