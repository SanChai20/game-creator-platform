<!doctype html><html><head><meta charset="utf-8">
<script>window.__GCP_CONFIG = { env: 'preview', kind: 'owner', gameId: 'capturetest', version: '1', api: 'http://127.0.0.1:8932', player: { id: 'u_test', name: 'Test' } };</script>
<script src="/sdk/gcp.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #202020; }
  /* the world: WebGL drawn by a module worker; the UI: a 2D canvas over it; a letterbox box around both */
  #frame { position: absolute; left: 0; top: 0; width: 100%; height: 100%; background: #301040; }
  #world, #ui { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  /* the one kind of element allowed over the game */
  #name { position: absolute; left: 380px; top: 200px; width: 180px; height: 32px; font: 16px sans-serif; color: #000; background: #ffffff; border: 2px solid #000; }
</style></head><body>
<div id="frame"><canvas id="world"></canvas><canvas id="ui"></canvas></div>
<input id="name" value="Ada" style="display:none">
<script>
  var W = innerWidth, H = innerHeight, world = document.getElementById('world'), ui = document.getElementById('ui');
  world.width = W; world.height = H; ui.width = W; ui.height = H;
  var off = world.transferControlToOffscreen();
  var wk = new Worker('/worker.js', { type: 'module' });
  wk.postMessage({ canvas: off }, [off]);
  var g = ui.getContext('2d'), t = 0;
  // the game's whole UI is drawn here: a HUD bar and a menu button with text, moving a little every frame
  (function loop() {
    t++; wk.postMessage({ frame: t });
    g.clearRect(0, 0, W, H);
    g.fillStyle = '#e01010'; g.fillRect(20, 20, 200 + (t % 60), 24);
    g.fillStyle = '#10c0c0'; g.beginPath(); g.arc(500, 100, 50, 0, Math.PI * 2); g.fill();
    g.fillStyle = '#ffffff'; g.font = 'bold 28px sans-serif'; g.fillText('PLAY', 60, 150);
    requestAnimationFrame(loop);
  })();
  if (location.search.indexOf('field') >= 0) document.getElementById('name').style.display = '';
  GCP.test.onCapture(function () { return [world, ui]; });
  GCP.test.onState(function () { return { t: t, screen: 'menu' }; });
  setTimeout(function () { GCP.ready(); window.ready = true; }, 200);
</script>
</body></html>
