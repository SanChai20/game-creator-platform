<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Robo Coder</title>
<style>body{margin:0;background:#0f172a;color:#e2e8f0;font-family:ui-monospace,monospace;display:flex;gap:16px;padding:16px}textarea{width:300px;height:280px;background:#1e293b;color:#a5f3fc;border:1px solid #334155;font:15px monospace;padding:8px}button{margin-top:8px;padding:8px 16px;background:#22c55e;border:0;border-radius:6px}</style></head>
<body><canvas id="grid" width="400" height="400"></canvas><div><textarea id="code">repeat(3, () => { move(); })
turn(); move(); move();</textarea><br><button id="run">Run</button><div id="out"></div></div>
<script>
const LEVEL = { size: 8, walls: [[3, 1], [3, 2], [5, 4], [5, 5]], goal: [3, 4] };
const cv = document.getElementById('grid'), g = cv.getContext('2d'), S = 50;
let bot = { x: 0, y: 1, d: 0 }, queue = [], won = false;
const DIRS = [[1, 0], [0, 1], [-1, 0], [0, -1]];
const api = {
  move: () => queue.push('move'), turn: () => queue.push('turn'),
  repeat: (n, fn) => { for (let i = 0; i < Math.min(n, 50); i++) fn(); },
};
function compile(src) {
  // the player's script runs with only the robot commands in scope
  return new Function('move', 'turn', 'repeat', '"use strict";\n' + src);
}
document.getElementById('run').onclick = () => {
  bot = { x: 0, y: 1, d: 0 }; queue = []; won = false;
  try { compile(document.getElementById('code').value)(api.move, api.turn, api.repeat); document.getElementById('out').textContent = `${queue.length} steps`; }
  catch (e) { document.getElementById('out').textContent = 'Error: ' + e.message; }
};
let acc = 0, last = 0;
function frame(t) {
  acc += t - last; last = t;
  if (acc > 300 && queue.length) {
    acc = 0; const op = queue.shift();
    if (op === 'turn') bot.d = (bot.d + 1) % 4;
    else { const nx = bot.x + DIRS[bot.d][0], ny = bot.y + DIRS[bot.d][1]; if (nx >= 0 && ny >= 0 && nx < LEVEL.size && ny < LEVEL.size && !LEVEL.walls.some(([wx, wy]) => wx === nx && wy === ny)) { bot.x = nx; bot.y = ny; } }
    if (bot.x === LEVEL.goal[0] && bot.y === LEVEL.goal[1]) won = true;
  }
  g.fillStyle = '#1e293b'; g.fillRect(0, 0, 400, 400);
  g.strokeStyle = '#334155'; for (let i = 0; i <= 8; i++) { g.beginPath(); g.moveTo(i * S, 0); g.lineTo(i * S, 400); g.moveTo(0, i * S); g.lineTo(400, i * S); g.stroke(); }
  g.fillStyle = '#64748b'; LEVEL.walls.forEach(([wx, wy]) => g.fillRect(wx * S + 2, wy * S + 2, S - 4, S - 4));
  g.fillStyle = '#facc15'; g.fillRect(LEVEL.goal[0] * S + 15, LEVEL.goal[1] * S + 10, 20, 30);
  g.fillStyle = won ? '#22c55e' : '#38bdf8'; g.beginPath(); g.arc(bot.x * S + 25, bot.y * S + 25, 18, 0, 7); g.fill();
  g.fillStyle = '#0f172a'; g.fillRect(bot.x * S + 25 + DIRS[bot.d][0] * 10 - 3, bot.y * S + 25 + DIRS[bot.d][1] * 10 - 3, 6, 6);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame); GCP.ready();
GCP.test.onPlaythrough(async (t) => {
  t.step('run a solution'); document.getElementById('code').value = 'turn(); repeat(3, () => move());\nrepeat(3, () => turn()); repeat(3, () => move());'; document.getElementById('run').click();
  await t.until(() => won, 12000, 'the battery'); t.assert(won, 'robot reached the battery');
});
</script></body></html>
