<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game</title><style>html,body{margin:0;height:100%;background:#123}canvas{display:block}</style></head><body><canvas id=c></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let t0=performance.now();requestAnimationFrame(function f(t){x.fillStyle='#345';x.fillRect(0,0,c.width,c.height);x.fillStyle='#9f6';x.beginPath();x.arc(200+t/10%300,200,30,0,7);x.fill();if(t-t0<1000)requestAnimationFrame(f)});GCP.ready();</script></body></html>
