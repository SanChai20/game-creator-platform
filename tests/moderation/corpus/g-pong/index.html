<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Midnight Paddles</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{width:100%;height:100%;display:block}</style></head>
<body><canvas id="p"></canvas><script>
const c = document.getElementById('p'), x = c.getContext('2d');
let W, H, me, cpu, ball, sc = [0, 0], up = 0, down = 0, pointerY = null;
function size() { W = c.width = innerWidth; H = c.height = innerHeight; }
size(); addEventListener('resize', size);
function serve(dir) { ball = { x: W / 2, y: H / 2, vx: dir * 320, vy: (Math.random() - 0.5) * 300 }; }
me = { y: H / 2 }; cpu = { y: H / 2 }; serve(1);
addEventListener('keydown', (e) => { if (e.code === 'KeyW' || e.code === 'ArrowUp') up = 1; if (e.code === 'KeyS' || e.code === 'ArrowDown') down = 1; });
addEventListener('keyup', (e) => { if (e.code === 'KeyW' || e.code === 'ArrowUp') up = 0; if (e.code === 'KeyS' || e.code === 'ArrowDown') down = 0; });
addEventListener('pointermove', (e) => { pointerY = e.clientY; });
const PH = 80;
function update(dt) {
  if (pointerY !== null) me.y += (pointerY - me.y) * Math.min(1, dt * 12); else me.y += (down - up) * 420 * dt;
  cpu.y += Math.sign(ball.y - cpu.y) * Math.min(Math.abs(ball.y - cpu.y), 260 * dt);
  ball.x += ball.vx * dt; ball.y += ball.vy * dt;
  if (ball.y < 6 || ball.y > H - 6) ball.vy *= -1;
  if (ball.x < 30 && Math.abs(ball.y - me.y) < PH / 2 && ball.vx < 0) { ball.vx *= -1.06; ball.vy += (ball.y - me.y) * 4; }
  if (ball.x > W - 30 && Math.abs(ball.y - cpu.y) < PH / 2 && ball.vx > 0) { ball.vx *= -1.06; ball.vy += (ball.y - cpu.y) * 4; }
  if (ball.x < -20) { sc[1]++; serve(1); } if (ball.x > W + 20) { sc[0]++; serve(-1); }
  if (sc[0] >= 7 || sc[1] >= 7) sc = [0, 0];
}
function render() {
  x.fillStyle = '#000'; x.fillRect(0, 0, W, H);
  x.fillStyle = '#eee'; x.fillRect(16, me.y - PH / 2, 8, PH); x.fillRect(W - 24, cpu.y - PH / 2, 8, PH);
  x.fillRect(ball.x - 5, ball.y - 5, 10, 10);
  for (let y = 0; y < H; y += 24) x.fillRect(W / 2 - 1, y, 2, 12);
  x.font = '40px monospace'; x.fillText(sc[0], W / 2 - 60, 50); x.fillText(sc[1], W / 2 + 36, 50);
}
let t0 = performance.now();
requestAnimationFrame(function tick(t) { update(Math.min(0.05, (t - t0) / 1000)); t0 = t; render(); requestAnimationFrame(tick); });
render(); GCP.ready();
</script></body></html>
