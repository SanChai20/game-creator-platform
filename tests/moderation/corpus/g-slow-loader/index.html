<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Terraform Tiles</title>
<style>html,body{margin:0;height:100%;background:#0d3b4f;color:#fff;font-family:sans-serif;overflow:hidden}#load{position:fixed;inset:0;display:grid;place-items:center;font-size:20px}canvas{display:block}</style></head>
<body><div id="load">Generating the island… <span id="pc">0</span>%</div><canvas id="cv"></canvas><script>
const cv = document.getElementById('cv'), cx = cv.getContext('2d'), R = 22, COLS = 26, ROWS = 14;
let hexes = [], hand = 'grass', placed = 0;
const COLOR = { sea: '#1d6f8a', sand: '#e8d48b', grass: '#6fbf4a', forest: '#2f7a3a', hill: '#9a8a6a', town: '#c0504d' };
function fit() { cv.width = innerWidth; cv.height = innerHeight; } fit(); addEventListener('resize', () => { fit(); draw(); });
function hexAt(c, r) { return { x: 40 + c * R * 1.75 + (r % 2) * R * 0.87, y: 40 + r * R * 1.5 }; }
async function generate() {
  const start = performance.now();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      // deliberately slow erosion simulation per tile
      let h = 0; for (let k = 0; k < 300000; k++) h += Math.sin(c * 0.37 + k * 1e-6) * Math.cos(r * 0.29 + k * 2e-6);
      const d = Math.hypot(c - COLS / 2, (r - ROWS / 2) * 1.7) / (COLS / 2);
      const v = 1 - d + (h / 300000) * 0.3;
      hexes.push({ c, r, kind: v < 0.15 ? 'sea' : v < 0.25 ? 'sand' : v < 0.6 ? 'grass' : v < 0.8 ? 'forest' : 'hill' });
    }
    const p = (r + 1) / ROWS; document.getElementById('pc').textContent = Math.round(p * 100); GCP.progress(p, 'Eroding the island');
    await new Promise((res) => setTimeout(res, 0));
  }
  return performance.now() - start;
}
function draw() {
  cx.fillStyle = '#0d3b4f'; cx.fillRect(0, 0, cv.width, cv.height);
  for (const h of hexes) { const p = hexAt(h.c, h.r); cx.fillStyle = COLOR[h.kind]; cx.beginPath(); for (let i = 0; i < 6; i++) { const a = Math.PI / 3 * i + Math.PI / 6; cx.lineTo(p.x + R * Math.cos(a), p.y + R * Math.sin(a)); } cx.fill(); }
  cx.fillStyle = '#fff'; cx.font = '18px sans-serif'; cx.fillText(`Placing: ${hand}  ·  tiles placed ${placed}  (1-3 to switch)`, 16, cv.height - 16);
}
cv.addEventListener('pointerdown', (e) => {
  let best = null, bd = R; for (const h of hexes) { const p = hexAt(h.c, h.r), d = Math.hypot(p.x - e.clientX, p.y - e.clientY); if (d < bd) { bd = d; best = h; } }
  if (best && best.kind !== 'sea') { best.kind = hand; placed++; draw(); }
});
addEventListener('keydown', (e) => { hand = { Digit1: 'grass', Digit2: 'forest', Digit3: 'town' }[e.code] || hand; draw(); });
generate().then(() => { document.getElementById('load').remove(); draw(); GCP.ready(); requestAnimationFrame(function wave(t) { cx.fillStyle = `rgba(255,255,255,${0.03 + 0.02 * Math.sin(t / 500)})`; cx.fillRect(0, 0, cv.width, 3); requestAnimationFrame(wave); }); });
GCP.test.onPlaythrough(async (t) => {
  t.step('place a town'); hand = 'town'; const h = hexes.find((x) => x.kind === 'grass'); h.kind = hand; placed++; draw();
  t.assert(hexes.some((x) => x.kind === 'town'), 'a town on the island');
});
</script></body></html>
