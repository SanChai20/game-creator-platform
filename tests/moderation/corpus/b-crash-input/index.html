<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Game</title><style>html,body{margin:0;height:100%;background:#123}canvas{display:block}</style></head><body><canvas id=c></canvas><script>const c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;let player={x:100,y:100},bullets=null,k={};addEventListener('keydown',e=>{k[e.code]=1});requestAnimationFrame(function f(t){x.fillStyle='#234';x.fillRect(0,0,c.width,c.height);x.fillStyle='#fc0';x.fillRect(player.x+Math.sin(t/300)*50,player.y,30,30);if(k.Space||k.Enter)bullets.push({x:player.x});requestAnimationFrame(f)});GCP.ready();</script></body></html>
