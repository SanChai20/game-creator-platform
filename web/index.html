<script>try{var t=localStorage.getItem('gcp.theme');document.documentElement.dataset.theme=t==='day'||t==='night'?t:matchMedia('(prefers-color-scheme: dark)').matches?'night':'day'}catch(e){document.documentElement.dataset.theme='day'}</script>

<meta name="apple-mobile-web-app-title" content="HearthCade">
<!-- Opened from the Home Screen: html.app (app.css keeps the clock readable and the header below it), and, as in a native
     app, no pinch zoom (the viewport's scale is pinned and Safari's pinch gesture is cancelled) and no rubber band. -->
<script>try{if(matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches||navigator.standalone===true){document.documentElement.classList.add('app');var v=document.querySelector('meta[name="viewport"]');if(v)v.content='width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover';document.addEventListener('gesturestart',function(e){e.preventDefault()},{passive:false})}}catch(e){}</script>
