<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shard Island</title>
<style>
  :root { color-scheme: dark; --ink: #0b0d0f; --bone: #f2ecdc; --glow: #7fe3ff; --sl: max(14px, env(safe-area-inset-left)); --st: max(14px, env(safe-area-inset-top)); --sr: max(14px, env(safe-area-inset-right)); }
  html, body { height: 100%; margin: 0; background: var(--ink); color: var(--bone); overflow: hidden; font: 14px/1.4 system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 0 2px rgba(0,0,0,.8), 0 1px 4px rgba(0,0,0,.6); }
  #count { position: absolute; left: var(--sl); top: var(--st); font-size: 22px; font-weight: 800; letter-spacing: .02em; }
  #count small { display: block; font-size: 12px; font-weight: 500; opacity: .75; letter-spacing: .08em; text-transform: uppercase; }
  #time { position: absolute; right: var(--sr); top: var(--st); font: 700 18px ui-monospace, Menlo, monospace; }
  #hint { position: absolute; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translateX(-50%); opacity: .8; white-space: nowrap; transition: opacity .6s; }
  #banner { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(8, 12, 16, .55); opacity: 0; transition: opacity .5s; }
  #banner.on { opacity: 1; pointer-events: auto; }
  #banner h1 { font-size: clamp(34px, 8vw, 64px); margin: 0 0 6px; letter-spacing: -.01em; }
  #banner button { pointer-events: auto; font: inherit; font-weight: 700; margin-top: 16px; padding: 11px 22px; border-radius: 999px; border: 0; background: var(--glow); color: #06222b; cursor: pointer; }
  #banner ol { list-style: none; padding: 0; margin: 14px auto 0; width: min(280px, 80vw); text-align: left; font: 14px ui-monospace, Menlo, monospace; }
  #banner li { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.12); }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="ui">
  <div id="count"><small>Shards</small><span id="n">0 / 0</span></div>
  <div id="time">0:00</div>
  <div id="hint">WASD to move · drag to look · Space to jump</div>
  <div id="banner"><div><h1 id="bt">All shards found</h1><div id="bs"></div><ol id="board"></ol><button id="again">Play again</button></div></div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
