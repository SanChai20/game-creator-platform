<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>New game</title>
<style>
  html, body { height: 100%; margin: 0; background: #0b0d0f; color: #e8e4da; overflow: hidden; font: 14px/1.4 system-ui, sans-serif; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); pointer-events: none; text-shadow: 0 1px 3px #000; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="hud">Move the pointer</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
