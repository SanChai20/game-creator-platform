<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Brackenfold</title>
<style>
/* The page: one canvas, nothing scrolls, nothing selects. The interface (createHud() in src/main.js) is drawn in a
   canvas over the game, with this game's voice passed to createHud: a serif title, warm parchment windows and slots. */
html, body { height: 100%; margin: 0; background: #12100c; color: #f1e6cf; overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
