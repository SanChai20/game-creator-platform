<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111015">
<title>HearthCade · Offline</title>
<!-- Served at /offline (the asset store drops .html) and shown by the service worker (sw.js) when a page cannot be loaded and no copy of the app is kept yet. It reloads by
     itself as soon as the device is back online. -->
<style>
  :root { color-scheme: light dark; --bg: #f3f1ea; --text: #17151c; --mute: #5d5a66; --accent: #e8572a; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111015; --text: #f6f4ee; --mute: #a29fab; } }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { min-height: 100%; display: grid; place-content: center; gap: 12px; text-align: center; padding: 24px 16px; box-sizing: border-box; }
  img { margin: 0 auto; border-radius: 16px; }
  h1 { margin: 8px 0 0; font-size: 22px; }
  p { margin: 0; color: var(--mute); max-width: 32em; }
  button { justify-self: center; margin-top: 8px; font: inherit; font-weight: 600; padding: 10px 20px; border-radius: 999px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" width="72" height="72">
  <h1 id="h">You're offline</h1>
  <p id="p">HearthCade needs a connection to load games. This page reloads by itself when you're back online.</p>
  <button id="b" type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  var T = {
    zh: ['你已离线', 'HearthCade 需要联网才能加载游戏。恢复网络后此页面会自动刷新。', '重试'],
    'zh-TW': ['你已離線', 'HearthCade 需要連網才能載入遊戲。恢復網路後此頁面會自動重新整理。', '重試'],
    ja: ['オフラインです', 'HearthCade でゲームを読み込むにはインターネット接続が必要です。接続が戻るとこのページは自動で再読み込みされます。', '再試行'],
    ko: ['오프라인 상태입니다', 'HearthCade에서 게임을 불러오려면 인터넷 연결이 필요합니다. 연결되면 이 페이지가 자동으로 새로 고쳐집니다.', '다시 시도'],
    es: ['Sin conexión', 'HearthCade necesita conexión para cargar los juegos. Esta página se recargará sola cuando vuelvas a estar en línea.', 'Reintentar']
  };
  try {
    var l = localStorage.getItem('gcp.lang') || navigator.language || 'en';
    var k = /^zh-(TW|HK|MO)|^zh-Hant/i.test(l) ? 'zh-TW' : l.slice(0, 2).toLowerCase();
    var s = T[k] || T[l];
    if (s) { document.documentElement.lang = k; document.getElementById('h').textContent = s[0]; document.getElementById('p').textContent = s[1]; document.getElementById('b').textContent = s[2]; }
  } catch (e) {}
  addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
